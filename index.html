<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Blind Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #222;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 25px 16px 60px;
}

h1, h2, h3 {
  margin-top: 0;
}

.subtitle {
  color: #666;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}

.round-header {
  margin-bottom: 20px;
}

.song-number {
  font-weight: bold;
  margin-bottom: 12px;
}

.field {
  margin-bottom: 12px;
}

.field:last-child {
  margin-bottom: 0;
}

label {
  display: block;
  font-size: 14px;
  color: #555;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
  background: white;
}

button {
  width: 100%;
  border: 0;
  border-radius: 9px;
  padding: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #222;
  color: white;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  margin-top: 12px;
  font-weight: bold;
}

.success {
  text-align: center;
  padding: 35px 20px;
}

.success-mark {
  font-size: 42px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<main>

  <div class="round-header">

    <h1>
      Le Blind Test
    </h1>

    <div id="roundInfo">
      Chargement…
    </div>

  </div>


  <section id="quiz" hidden>

    <div class="card">

      <label for="teamName">
        Nom de l'équipe
      </label>

      <input
        id="teamName"
        type="text"
        placeholder="Votre équipe"
        autocomplete="off"
      >

    </div>


    <div id="songs"></div>


    <button
      id="submitButton"
      class="primary"
    >
      Envoyer la manche
    </button>

    <div
      id="submitStatus"
      class="status"
    ></div>

  </section>


  <section
    id="success"
    class="card success"
    hidden
  >

    <div class="success-mark">
      ✓
    </div>

    <h2 id="successTitle">
      Manche envoyée
    </h2>

    <p id="successText">
      Vos réponses ont bien été enregistrées.
    </p>

    <p>
      Attendez les résultats !
    </p>

  </section>

</main>


<script type="module">

/* =========================
   FIREBASE
   ========================= */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getDatabase,
  ref,
  get,
  set,
  push
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDypIWezmJvZbbuq7Yv054YxNb529wfboQ",

  authDomain:
    "le-blind-test.firebaseapp.com",

  databaseURL:
    "https://le-blind-test-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "le-blind-test",

  storageBucket:
    "le-blind-test.firebasestorage.app",

  messagingSenderId:
    "551170415765",

  appId:
    "1:551170415765:web:3cc00ae2c266d36e628f9c"

};


const app =
  initializeApp(firebaseConfig);


const auth =
  getAuth(app);


const database =
  getDatabase(app);


/* =========================
   ETAT
   ========================= */

let currentRound = 1;

let teamId =
  localStorage.getItem(
    "blindTestTeamId"
  );

let teamName =
  localStorage.getItem(
    "blindTestTeamName"
  );


/* =========================
   DOM
   ========================= */

const roundInfo =
  document.getElementById(
    "roundInfo"
  );

const quiz =
  document.getElementById(
    "quiz"
  );

const songsContainer =
  document.getElementById(
    "songs"
  );

const teamNameInput =
  document.getElementById(
    "teamName"
  );

const submitButton =
  document.getElementById(
    "submitButton"
  );

const submitStatus =
  document.getElementById(
    "submitStatus"
  );

const success =
  document.getElementById(
    "success"
  );

const successTitle =
  document.getElementById(
    "successTitle"
  );

const successText =
  document.getElementById(
    "successText"
  );


/* =========================
   DEMARRAGE
   ========================= */

start();


async function start() {

  try {

    await signInAnonymously(auth);

    await checkTeamIdentity();

    await initialiseGame();

  }

  catch (error) {

    console.error(error);

    roundInfo.textContent =
      "Impossible de charger le blind test.";

  }

}


/* =========================
   IDENTITE EQUIPE
   ========================= */

async function checkTeamIdentity() {

  if (!teamId) {
    return;
  }


  try {

    const snapshot =
      await get(
        ref(
          database,
          `teams/${teamId}`
        )
      );


    if (!snapshot.exists()) {

      clearLocalTeam();
      return;

    }


    const team =
      snapshot.val();


    teamName =
      team.teamName || "";


    localStorage.setItem(
      "blindTestTeamName",
      teamName
    );

  }

  catch (error) {

    /*
      Une ancienne identité locale peut ne
      plus avoir accès à l'équipe après une
      réinitialisation.

      Dans ce cas, le navigateur redevient
      simplement une nouvelle équipe.
    */

    console.warn(
      "Ancienne équipe supprimée ou inaccessible."
    );

    clearLocalTeam();

  }

}


function clearLocalTeam() {

  localStorage.removeItem(
    "blindTestTeamId"
  );

  localStorage.removeItem(
    "blindTestTeamName"
  );


  teamId = null;
  teamName = null;

}


/* =========================
   CHARGER LA PARTIE
   ========================= */

async function initialiseGame() {

  /*
    IMPORTANT :
    la page équipe ne lit maintenant QUE
    publicSettings.

    Les réponses correctes restent dans
    settings et ne sont accessibles qu'à
    l'administrateur.
  */

  const snapshot =
    await get(
      ref(
        database,
        "publicSettings"
      )
    );


  if (!snapshot.exists()) {

    roundInfo.textContent =
      "La soirée n'est pas encore configurée.";

    return;

  }


  const publicSettings =
    snapshot.val();


  currentRound =
    Number(
      publicSettings.currentRound
      || 1
    );


  const roundName =
    publicSettings
      .rounds
      ?.[currentRound]
      ?.name
    || "";


  roundInfo.innerHTML = `

    <strong>
      Manche ${currentRound} sur 3
    </strong>

    ${roundName
      ? ` — ${escapeHTML(roundName)}`
      : ""
    }
  `;


  renderSongs();


  if (teamName) {

    teamNameInput.value =
      teamName;

  }


  await checkExistingSubmission();

}


/* =========================
   CREER LES 10 CHANSONS
   ========================= */

function renderSongs() {

  songsContainer.innerHTML = "";


  const secondLabel =
    currentRound === 3
      ? "Comédie musicale"
      : "Artiste(s)";


  for (
    let song = 1;
    song <= 10;
    song++
  ) {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    card.innerHTML = `

      <div class="song-number">
        Chanson ${song}
      </div>


      <div class="field">

        <label>
          Titre
        </label>

        <input
          id="title-${song}"
          type="text"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label>
          ${secondLabel}
        </label>

        <input
          id="second-${song}"
          type="text"
          autocomplete="off"
        >

      </div>
    `;


    songsContainer.appendChild(
      card
    );

  }

}


/* =========================
   VERIFIER SI DEJA ENVOYE
   ========================= */

async function checkExistingSubmission() {

  if (!teamId) {

    quiz.hidden = false;
    success.hidden = true;

    return;

  }


  try {

    const snapshot =
      await get(
        ref(
          database,
          `rounds/${currentRound}/submissions/${teamId}`
        )
      );


    if (snapshot.exists()) {

      showAlreadySubmitted();

    }

    else {

      quiz.hidden = false;
      success.hidden = true;

    }

  }

  catch (error) {

    console.error(error);

    quiz.hidden = false;
    success.hidden = true;

  }

}


/* =========================
   ENVOI
   ========================= */

submitButton.addEventListener(
  "click",
  async () => {

    const name =
      teamNameInput
        .value
        .trim();


    if (!name) {

      submitStatus.textContent =
        "Indiquez le nom de votre équipe.";

      teamNameInput.focus();

      return;

    }


    submitButton.disabled = true;

    submitStatus.textContent =
      "Envoi…";


    try {

      /*
        Première manche de cette équipe :
        on crée son identifiant indépendant.
      */

      if (!teamId) {

        const newTeamRef =
          push(
            ref(
              database,
              "teams"
            )
          );


        teamId =
          newTeamRef.key;


        teamName =
          name;


        await set(
          newTeamRef,
          {

            teamName:
              name,

            ownerUid:
              auth.currentUser.uid

          }
        );


        localStorage.setItem(
          "blindTestTeamId",
          teamId
        );


        localStorage.setItem(
          "blindTestTeamName",
          name
        );

      }


      /*
        Construire les réponses.
      */

      const answers = {};


      for (
        let song = 1;
        song <= 10;
        song++
      ) {

        answers[song] = {

          title:
            document
              .getElementById(
                `title-${song}`
              )
              .value
              .trim(),

          second:
            document
              .getElementById(
                `second-${song}`
              )
              .value
              .trim()

        };

      }


      /*
        Envoi unique de la manche.

        Les règles Firebase empêchent
        l'équipe d'écraser ensuite cette
        soumission.
      */

      await set(
        ref(
          database,
          `rounds/${currentRound}/submissions/${teamId}`
        ),
        {

          teamName:
            teamName || name,

          ownerUid:
            auth.currentUser.uid,

          answers,

          submittedAt:
            Date.now()

        }
      );


      submitStatus.textContent = "";

      showSubmitted();

    }

    catch (error) {

      console.error(error);


      /*
        Si l'envoi existe déjà, on affiche
        simplement l'état verrouillé.
      */

      if (teamId) {

        try {

          const snapshot =
            await get(
              ref(
                database,
                `rounds/${currentRound}/submissions/${teamId}`
              )
            );


          if (snapshot.exists()) {

            showAlreadySubmitted();

            return;

          }

        }

        catch (checkError) {

          console.error(
            checkError
          );

        }

      }


      submitStatus.textContent =
        "L'envoi a échoué. Réessayez.";


      submitButton.disabled = false;

    }

  }
);


/* =========================
   ECRANS DE SUCCES
   ========================= */

function showSubmitted() {

  quiz.hidden = true;
  success.hidden = false;


  successTitle.textContent =
    "Manche envoyée ✓";


  successText.textContent =
    "Vos réponses ont bien été enregistrées et sont maintenant verrouillées.";

}


function showAlreadySubmitted() {

  quiz.hidden = true;
  success.hidden = false;


  successTitle.textContent =
    "Manche déjà envoyée ✓";


  successText.textContent =
    "Vos réponses ont bien été enregistrées.";

}


/* =========================
   SECURITE AFFICHAGE
   ========================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}

</script>

</body>
</html>
