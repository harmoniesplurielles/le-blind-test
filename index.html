<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Le Blind Test</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #222;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 24px 16px 60px;
}

h1 { margin-bottom: 5px; }

.subtitle {
  color: #666;
  margin-top: 0;
}

.round-name {
  font-size: 22px;
  font-weight: bold;
  margin: 4px 0 20px;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

.song-number {
  font-weight: bold;
  margin-bottom: 12px;
}

.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
  color: #555;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 12px;
  border: 0;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #222;
  color: white;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#status {
  margin-top: 15px;
  text-align: center;
  font-weight: bold;
}

.message {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 25px;
  text-align: center;
}

.loading {
  text-align: center;
  padding: 40px 10px;
  color: #666;
}

@media (max-width: 520px) {
  .fields {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<main>

<h1>Le Blind Test</h1>

<div id="loading" class="loading">
  Chargement de la manche…
</div>


<div id="game" hidden>

  <p class="subtitle" id="roundNumber"></p>

  <div class="round-name" id="roundName"></div>


  <div id="quiz">

    <div class="card">

      <label for="teamName">
        Nom de l'équipe
      </label>

      <input
        id="teamName"
        type="text"
        placeholder="Ex. Les Divas"
        autocomplete="off"
      >

    </div>


    <p class="subtitle" id="instructions"></p>

    <div id="songs"></div>


    <button id="submitButton">
      Envoyer la manche
    </button>

    <div id="status"></div>

  </div>


  <div id="alreadySubmitted" class="message" hidden>

    <h2>Manche déjà envoyée ✓</h2>

    <p>
      Vos réponses ont bien été enregistrées.
    </p>

    <p>
      Attendez les résultats !
    </p>

  </div>


  <div id="success" class="message" hidden>

    <h2>Manche envoyée ✓</h2>

    <p>
      Vos réponses sont enregistrées et verrouillées.
    </p>

    <p>
      Attendez les résultats !
    </p>

  </div>

</div>

</main>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  push,
  set
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDypIWezmJvZbbuq7Yv054YxNb529wfboQ",
  authDomain: "le-blind-test.firebaseapp.com",
  databaseURL: "https://le-blind-test-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "le-blind-test",
  storageBucket: "le-blind-test.firebasestorage.app",
  messagingSenderId: "551170415765",
  appId: "1:551170415765:web:3cc00ae2c266d36e628f9c"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const database = getDatabase(app);


const loading =
  document.getElementById("loading");

const game =
  document.getElementById("game");

const quiz =
  document.getElementById("quiz");

const songsContainer =
  document.getElementById("songs");

const submitButton =
  document.getElementById("submitButton");

const status =
  document.getElementById("status");

const teamNameInput =
  document.getElementById("teamName");

const alreadySubmitted =
  document.getElementById("alreadySubmitted");

const success =
  document.getElementById("success");


let user = null;
let currentRound = null;
let roundName = "";
let teamId = null;


/* =========================
   CONNEXION
   ========================= */

try {

  const result =
    await signInAnonymously(auth);

  user = result.user;

}
catch (error) {

  console.error(error);

  loading.textContent =
    "Impossible de se connecter au jeu.";
}


/* =========================
   CONFIGURATION
   ========================= */

if (user) {

  try {

    const snapshot =
      await get(
        ref(database, "settings")
      );


    if (!snapshot.exists()) {

      loading.textContent =
        "Aucune manche n'est ouverte pour le moment.";

    }

    else {

      const settings =
        snapshot.val();

      currentRound =
        Number(settings.currentRound);

      roundName =
        settings.rounds?.[currentRound]?.name
        || `Manche ${currentRound}`;


      await checkTeamIdentity();

      initialiseGame();

      await checkExistingSubmission();

    }

  }

  catch (error) {

    console.error(error);

    loading.textContent =
      "Impossible de charger la manche.";

  }

}


/* =========================
   IDENTITÉ DE L'ÉQUIPE
   ========================= */

async function checkTeamIdentity() {

  teamId =
    localStorage.getItem(
      "blindTestTeamId"
    );


  if (!teamId) {
    return;
  }


  try {

    const snapshot =
      await get(
        ref(
          database,
          `teams/${teamId}`
        )
      );


    /*
      L'équipe existe toujours :
      on conserve son identité.
    */

    if (snapshot.exists()) {

      const team =
        snapshot.val();

      if (team.teamName) {

        localStorage.setItem(
          "blindTestTeamName",
          team.teamName
        );

      }

      return;

    }


    /*
      L'équipe n'existe plus dans Firebase.

      Cela signifie notamment qu'une nouvelle
      partie a été lancée par l'organisateur.
    */

    clearLocalTeam();

  }

  catch (error) {

    /*
      Si l'ancien identifiant appartient à une
      ancienne session Firebase, sa lecture peut
      être refusée.

      On le considère alors comme périmé.
    */

    console.log(
      "Ancienne identité locale supprimée."
    );

    clearLocalTeam();

  }

}


function clearLocalTeam() {

  localStorage.removeItem(
    "blindTestTeamId"
  );

  localStorage.removeItem(
    "blindTestTeamName"
  );

  teamId = null;

}


/* =========================
   INTERFACE
   ========================= */

function initialiseGame() {

  loading.hidden = true;
  game.hidden = false;


  document
    .getElementById("roundNumber")
    .textContent =
      `Manche ${currentRound} sur 3`;


  document
    .getElementById("roundName")
    .textContent =
      roundName;


  const secondField =
    currentRound === 3
      ? "Comédie musicale"
      : "Artiste(s)";


  document
    .getElementById("instructions")
    .textContent =
      currentRound === 3
        ? "Pour chaque chanson, indiquez le titre et la comédie musicale dont elle est tirée."
        : "Pour chaque chanson, indiquez le titre et le ou les artistes.";


  songsContainer.innerHTML = "";


  for (let i = 1; i <= 10; i++) {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `

      <div class="song-number">
        Chanson ${i}
      </div>

      <div class="fields">

        <div>

          <label for="title-${i}">
            Titre
          </label>

          <input
            id="title-${i}"
            type="text"
            autocomplete="off"
            placeholder="Titre de la chanson"
          >

        </div>

        <div>

          <label for="second-${i}">
            ${secondField}
          </label>

          <input
            id="second-${i}"
            type="text"
            autocomplete="off"
            placeholder="${secondField}"
          >

        </div>

      </div>
    `;

    songsContainer.appendChild(card);

  }


  const storedTeamName =
    localStorage.getItem(
      "blindTestTeamName"
    );


  if (storedTeamName) {

    teamNameInput.value =
      storedTeamName;

  }

}


/* =========================
   DÉJÀ ENVOYÉ ?
   ========================= */

async function checkExistingSubmission() {

  if (!teamId) {
    return;
  }


  try {

    const snapshot =
      await get(
        ref(
          database,
          `rounds/${currentRound}/submissions/${teamId}`
        )
      );


    if (snapshot.exists()) {

      quiz.hidden = true;
      success.hidden = true;

      alreadySubmitted.hidden = false;

    }

  }

  catch (error) {

    console.error(error);

  }

}


/* =========================
   ENVOI
   ========================= */

submitButton.addEventListener(
  "click",
  async () => {

    const name =
      teamNameInput.value.trim();


    if (!name) {

      status.textContent =
        "Indiquez le nom de votre équipe.";

      teamNameInput.focus();

      return;

    }


    if (!user || !currentRound) {

      status.textContent =
        "Connexion au jeu impossible.";

      return;

    }


    submitButton.disabled = true;

    status.textContent =
      "Envoi en cours…";


    try {

      /*
        Si aucune équipe n'existe encore
        sur cet appareil, on la crée.
      */

      if (!teamId) {

        const newTeamRef =
          push(
            ref(database, "teams")
          );

        teamId =
          newTeamRef.key;


        await set(
          ref(
            database,
            `teams/${teamId}`
          ),
          {
            teamName: name,
            ownerUid: user.uid
          }
        );


        localStorage.setItem(
          "blindTestTeamId",
          teamId
        );

        localStorage.setItem(
          "blindTestTeamName",
          name
        );

      }


      /*
        La soumission ne peut être créée
        qu'une seule fois grâce aux règles
        Firebase.
      */

      const answers = {};


      for (let i = 1; i <= 10; i++) {

        answers[i] = {

          title:
            document
              .getElementById(
                `title-${i}`
              )
              .value
              .trim(),

          second:
            document
              .getElementById(
                `second-${i}`
              )
              .value
              .trim()

        };

      }


      await set(
        ref(
          database,
          `rounds/${currentRound}/submissions/${teamId}`
        ),
        {
          teamName:
            localStorage.getItem(
              "blindTestTeamName"
            ) || name,

          ownerUid:
            user.uid,

          answers:
            answers,

          submittedAt:
            Date.now()
        }
      );


      quiz.hidden = true;
      alreadySubmitted.hidden = true;
      success.hidden = false;

    }

    catch (error) {

      console.error(error);


      /*
        Si une soumission existe déjà,
        Firebase refuse son remplacement.
      */

      try {

        const existing =
          await get(
            ref(
              database,
              `rounds/${currentRound}/submissions/${teamId}`
            )
          );


        if (existing.exists()) {

          quiz.hidden = true;
          success.hidden = true;
          alreadySubmitted.hidden = false;

          return;

        }

      }

      catch (checkError) {

        console.error(checkError);

      }


      status.textContent =
        "L'envoi a échoué. Réessayez.";

      submitButton.disabled = false;

    }

  }
);

</script>

</body>
</html>
