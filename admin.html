<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administration — Le Blind Test</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6f6f6;
  color: #222;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 30px 18px 70px;
}

h1, h2, h3 { margin-top: 0; }

.subtitle {
  color: #666;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 16px;
}

button {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.primary {
  background: #222;
  color: white;
}

.secondary {
  background: #e8e8e8;
  color: #222;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

input,
select {
  width: 100%;
  padding: 11px;
  font-size: 16px;
  border: 1px solid #bbb;
  border-radius: 8px;
  background: white;
}

label {
  display: block;
  font-size: 14px;
  color: #555;
  margin-bottom: 5px;
}

#login {
  max-width: 450px;
  margin: 60px auto;
}

#login input {
  margin-bottom: 12px;
}

.full {
  width: 100%;
}

.topline {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 25px 0;
}

.tab {
  background: #ddd;
}

.tab.active {
  background: #222;
  color: white;
}

.toolbar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 12px;
  align-items: end;
}

.round {
  margin-top: 25px;
}

.round-title {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 15px;
  align-items: end;
}

.song-row {
  display: grid;
  grid-template-columns: 50px 1fr 1fr;
  gap: 10px;
  align-items: end;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

.song-row:last-child {
  border-bottom: none;
}

.song-number {
  font-weight: bold;
  padding-bottom: 12px;
}

.correction-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.reference {
  background: #f0f0f0;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 18px;
}

.reference strong {
  display: block;
  margin-bottom: 5px;
}

.team-answer {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.team-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.answer-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.answer-button {
  text-align: left;
  background: #eee;
  color: #222;
  min-height: 65px;
}

.answer-button.accepted {
  background: #222;
  color: white;
}

.answer-label {
  display: block;
  font-size: 12px;
  opacity: .7;
  margin-bottom: 5px;
}

.answer-text {
  display: block;
}

.navigation {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  align-items: center;
  margin-top: 18px;
}

.navigation button:last-child {
  justify-self: end;
}

.navigation-status {
  text-align: center;
  font-weight: bold;
}

.rankings {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 25px;
}

.ranking-row {
  display: grid;
  grid-template-columns: 50px 1fr auto;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
  align-items: center;
}

.ranking-row:last-child {
  border-bottom: none;
}

.rank {
  font-weight: bold;
}

.score {
  font-weight: bold;
}

.empty {
  color: #777;
  font-style: italic;
}

.status {
  margin-top: 12px;
  font-weight: bold;
}

.reset-card {
  margin-top: 35px;
  border: 2px solid #222;
}

@media (max-width: 700px) {

  .song-row,
  .round-title,
  .toolbar,
  .correction-controls,
  .rankings {
    grid-template-columns: 1fr;
  }

  .answer-buttons {
    grid-template-columns: 1fr;
  }

  .song-number {
    padding-bottom: 0;
  }

  .topline {
    display: block;
  }

  .tabs {
    flex-wrap: wrap;
  }
}
</style>
</head>

<body>

<main>

<!-- =========================
     CONNEXION
     ========================= -->

<section id="login">

  <div class="card">

    <h1>Administration</h1>

    <p class="subtitle">
      Le Blind Test
    </p>

    <label for="email">
      E-mail
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
    >

    <label for="password">
      Mot de passe
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      class="primary full"
    >
      Se connecter
    </button>

    <div
      id="loginStatus"
      class="status"
    ></div>

  </div>

</section>


<!-- =========================
     ADMIN
     ========================= -->

<section id="admin" hidden>

  <div class="topline">

    <div>

      <h1>Le Blind Test</h1>

      <p class="subtitle">
        Administration
      </p>

    </div>

    <button
      id="logoutButton"
      class="secondary"
    >
      Déconnexion
    </button>

  </div>


  <div class="tabs">

    <button
      id="prepareTab"
      class="tab active"
    >
      Préparer la soirée
    </button>

    <button
      id="correctTab"
      class="tab"
    >
      Correction & classements
    </button>

  </div>


  <!-- =========================
       PREPARATION
       ========================= -->

  <section id="prepareSection">

    <div class="card">

      <div class="toolbar">

        <div>

          <label for="currentRound">
            Manche actuellement ouverte
          </label>

          <select id="currentRound">

            <option value="1">
              Manche 1
            </option>

            <option value="2">
              Manche 2
            </option>

            <option value="3">
              Manche 3
            </option>

          </select>

        </div>


        <button
          id="saveButton"
          class="primary"
        >
          Enregistrer
        </button>

      </div>

      <div
        id="saveStatus"
        class="status"
      ></div>

    </div>


    <div id="rounds"></div>


    <!-- ENREGISTRER EN BAS -->

    <div class="card">

      <button
        id="saveButtonBottom"
        class="primary full"
      >
        Enregistrer
      </button>

      <div
        id="saveStatusBottom"
        class="status"
      ></div>

    </div>


    <!-- REINITIALISATION -->

    <div class="card reset-card">

      <h2>
        Nouvelle partie
      </h2>

      <p>
        Supprime toutes les équipes, leurs réponses,
        les corrections et les scores.
      </p>

      <p>
        <strong>
          Les manches et les réponses de référence
          seront conservées.
        </strong>
      </p>

      <button
        id="resetGameButton"
        class="secondary"
      >
        Réinitialiser la partie
      </button>

    </div>

  </section>


  <!-- =========================
       CORRECTION
       ========================= -->

  <section
    id="correctSection"
    hidden
  >

    <div class="card correction-controls">

      <div>

        <label for="correctionRound">
          Manche à corriger
        </label>

        <select id="correctionRound">

          <option value="1">
            Manche 1
          </option>

          <option value="2">
            Manche 2
          </option>

          <option value="3">
            Manche 3
          </option>

        </select>

      </div>


      <div>

        <label>&nbsp;</label>

        <button
          id="refreshButton"
          class="secondary full"
        >
          Actualiser les réponses
        </button>

      </div>

    </div>


    <div id="correctionArea">

      <div class="card">

        <h2 id="correctionTitle">
          Correction
        </h2>

        <div
          id="referenceAnswer"
          class="reference"
        ></div>


        <button
          id="validateAllButton"
          class="secondary"
        >
          Tout valider
        </button>


        <div
          id="teamAnswers"
          style="margin-top:18px;"
        ></div>


        <div class="navigation">

          <button
            id="previousSong"
            class="secondary"
          >
            ← Précédente
          </button>

          <div
            id="navigationStatus"
            class="navigation-status"
          >
            Chanson 1 / 10
          </div>

          <button
            id="nextSong"
            class="secondary"
          >
            Suivante →
          </button>

        </div>

      </div>

    </div>


    <!-- CLASSEMENTS -->

    <div class="rankings">

      <div class="card">

        <h2 id="roundRankingTitle">
          Classement de la manche
        </h2>

        <div id="roundRanking"></div>

      </div>


      <div class="card">

        <h2>
          Classement général
        </h2>

        <div id="globalRanking"></div>

      </div>

    </div>

  </section>

</section>

</main>


<script type="module">

/* =========================
   FIREBASE
   ========================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  get,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDypIWezmJvZbbuq7Yv054YxNb529wfboQ",

  authDomain:
    "le-blind-test.firebaseapp.com",

  databaseURL:
    "https://le-blind-test-default-rtdb.europe-west1.firebasedatabase.app",

  projectId:
    "le-blind-test",

  storageBucket:
    "le-blind-test.firebasestorage.app",

  messagingSenderId:
    "551170415765",

  appId:
    "1:551170415765:web:3cc00ae2c266d36e628f9c"

};


const ADMIN_UID =
  "fMWxlPehvGQs0ggcZDTwAbe2eDp2";


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


/* =========================
   DONNEES
   ========================= */

let settings = null;

let submissions = {
  1: {},
  2: {},
  3: {}
};

let corrections = {
  1: {},
  2: {},
  3: {}
};

let correctionRound = 1;
let correctionSong = 1;


/* =========================
   DOM
   ========================= */

const loginSection =
  document.getElementById("login");

const adminSection =
  document.getElementById("admin");

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const logoutButton =
  document.getElementById("logoutButton");

const loginStatus =
  document.getElementById("loginStatus");

const prepareTab =
  document.getElementById("prepareTab");

const correctTab =
  document.getElementById("correctTab");

const prepareSection =
  document.getElementById("prepareSection");

const correctSection =
  document.getElementById("correctSection");

const roundsContainer =
  document.getElementById("rounds");

const currentRoundSelect =
  document.getElementById("currentRound");

const saveButton =
  document.getElementById("saveButton");

const saveStatus =
  document.getElementById("saveStatus");

const saveButtonBottom =
  document.getElementById("saveButtonBottom");

const saveStatusBottom =
  document.getElementById("saveStatusBottom");

const correctionRoundSelect =
  document.getElementById("correctionRound");

const teamAnswers =
  document.getElementById("teamAnswers");

const referenceAnswer =
  document.getElementById("referenceAnswer");

const navigationStatus =
  document.getElementById("navigationStatus");

const roundRanking =
  document.getElementById("roundRanking");

const globalRanking =
  document.getElementById("globalRanking");


/* =========================
   CREATION DES MANCHES
   ========================= */

function createRounds() {

  roundsContainer.innerHTML = "";


  for (
    let round = 1;
    round <= 3;
    round++
  ) {

    const secondField =
      round === 3
        ? "Comédie musicale"
        : "Artiste(s)";


    const section =
      document.createElement("section");


    section.className =
      "round";


    section.innerHTML = `

      <div class="card">

        <div class="round-title">

          <h2>
            Manche ${round}
          </h2>

          <div>

            <label>
              Nom / thème de la manche
            </label>

            <input
              id="round-name-${round}"
              type="text"
              placeholder="Ex. Années 2000"
            >

          </div>

        </div>

        <div id="songs-${round}"></div>

      </div>
    `;


    roundsContainer.appendChild(
      section
    );


    const songs =
      document.getElementById(
        `songs-${round}`
      );


    for (
      let song = 1;
      song <= 10;
      song++
    ) {

      const row =
        document.createElement("div");


      row.className =
        "song-row";


      row.innerHTML = `

        <div class="song-number">
          ${song}
        </div>

        <div>

          <label>
            Titre
          </label>

          <input
            id="title-${round}-${song}"
            type="text"
          >

        </div>

        <div>

          <label>
            ${secondField}
          </label>

          <input
            id="second-${round}-${song}"
            type="text"
          >

        </div>
      `;


      songs.appendChild(
        row
      );

    }

  }

}


createRounds();


/* =========================
   CONNEXION
   ========================= */

loginButton.addEventListener(
  "click",
  async () => {

    loginStatus.textContent =
      "Connexion…";


    try {

      const result =
        await signInWithEmailAndPassword(
          auth,
          emailInput.value.trim(),
          passwordInput.value
        );


      if (
        result.user.uid
        !== ADMIN_UID
      ) {

        await signOut(auth);

        loginStatus.textContent =
          "Ce compte n'est pas autorisé.";

        return;

      }


      loginStatus.textContent = "";

    }

    catch (error) {

      console.error(error);

      loginStatus.textContent =
        "Connexion impossible.";

    }

  }
);


logoutButton.addEventListener(
  "click",
  () => signOut(auth)
);


/* =========================
   ETAT DE CONNEXION
   ========================= */

onAuthStateChanged(
  auth,
  async user => {

    if (
      user
      &&
      user.uid === ADMIN_UID
    ) {

      loginSection.hidden = true;
      adminSection.hidden = false;

      await loadSettings();

    }

    else {

      loginSection.hidden = false;
      adminSection.hidden = true;

    }

  }
);


/* =========================
   ONGLETS
   ========================= */

prepareTab.addEventListener(
  "click",
  () => {

    prepareTab
      .classList
      .add("active");

    correctTab
      .classList
      .remove("active");

    prepareSection.hidden = false;
    correctSection.hidden = true;

  }
);


correctTab.addEventListener(
  "click",
  async () => {

    correctTab
      .classList
      .add("active");

    prepareTab
      .classList
      .remove("active");

    correctSection.hidden = false;
    prepareSection.hidden = true;


    correctionRound =
      Number(
        correctionRoundSelect.value
      );

    correctionSong = 1;


    await loadAllGameData();

  }
);


/* =========================
   CHARGER CONFIGURATION
   ========================= */

async function loadSettings() {

  try {

    const snapshot =
      await get(
        ref(
          database,
          "settings"
        )
      );


    if (!snapshot.exists()) {
      return;
    }


    settings =
      snapshot.val();


    currentRoundSelect.value =
      settings.currentRound || 1;


    correctionRoundSelect.value =
      settings.currentRound || 1;


    for (
      let round = 1;
      round <= 3;
      round++
    ) {

      const roundData =
        settings.rounds?.[round];


      if (!roundData) {
        continue;
      }


      document
        .getElementById(
          `round-name-${round}`
        )
        .value =
          roundData.name || "";


      for (
        let song = 1;
        song <= 10;
        song++
      ) {

        const answer =
          roundData.answers?.[song];


        if (!answer) {
          continue;
        }


        document
          .getElementById(
            `title-${round}-${song}`
          )
          .value =
            answer.title || "";


        document
          .getElementById(
            `second-${round}-${song}`
          )
          .value =
            answer.second || "";

      }

    }

  }

  catch (error) {

    console.error(error);

  }

}


/* =========================
   ENREGISTRER CONFIGURATION
   ========================= */

async function saveSettings() {

  saveButton.disabled = true;
  saveButtonBottom.disabled = true;


  saveStatus.textContent =
    "Enregistrement…";

  saveStatusBottom.textContent =
    "Enregistrement…";


  const data = {

    currentRound:
      Number(
        currentRoundSelect.value
      ),

    rounds: {}

  };


  for (
    let round = 1;
    round <= 3;
    round++
  ) {

    const answers = {};


    for (
      let song = 1;
      song <= 10;
      song++
    ) {

      answers[song] = {

        title:
          document
            .getElementById(
              `title-${round}-${song}`
            )
            .value
            .trim(),

        second:
          document
            .getElementById(
              `second-${round}-${song}`
            )
            .value
            .trim()

      };

    }


    data.rounds[round] = {

      name:
        document
          .getElementById(
            `round-name-${round}`
          )
          .value
          .trim(),

      answers

    };

  }


  try {

    await set(
      ref(
        database,
        "settings"
      ),
      data
    );


    settings = data;


    saveStatus.textContent =
      "Soirée enregistrée ✓";

    saveStatusBottom.textContent =
      "Soirée enregistrée ✓";

  }

  catch (error) {

    console.error(error);


    saveStatus.textContent =
      "L'enregistrement a échoué.";

    saveStatusBottom.textContent =
      "L'enregistrement a échoué.";

  }


  saveButton.disabled = false;
  saveButtonBottom.disabled = false;

}


saveButton.addEventListener(
  "click",
  saveSettings
);


saveButtonBottom.addEventListener(
  "click",
  saveSettings
);


/* =========================
   CHARGER DONNEES DU JEU
   ========================= */

async function loadAllGameData() {

  await loadSettings();


  for (
    let round = 1;
    round <= 3;
    round++
  ) {

    const submissionsSnapshot =
      await get(
        ref(
          database,
          `rounds/${round}/submissions`
        )
      );


    submissions[round] =
      submissionsSnapshot.exists()
        ? submissionsSnapshot.val()
        : {};


    const correctionsSnapshot =
      await get(
        ref(
          database,
          `rounds/${round}/corrections`
        )
      );


    corrections[round] =
      correctionsSnapshot.exists()
        ? correctionsSnapshot.val()
        : {};

  }


  renderCorrection();
  renderRankings();

}


/* =========================
   CORRECTION
   ========================= */

function renderCorrection() {

  const roundData =
    settings
      ?.rounds
      ?.[correctionRound];


  const expected =
    roundData
      ?.answers
      ?.[correctionSong]
    || {};


  const secondLabel =
    correctionRound === 3
      ? "Comédie musicale"
      : "Artiste(s)";


  document
    .getElementById(
      "correctionTitle"
    )
    .textContent =
      `Manche ${correctionRound} — ${roundData?.name || ""}`;


  referenceAnswer.innerHTML = `

    <strong>
      Chanson ${correctionSong} — Réponse attendue
    </strong>

    <div>
      Titre :
      <b>
        ${escapeHTML(expected.title || "—")}
      </b>
    </div>

    <div>
      ${secondLabel} :
      <b>
        ${escapeHTML(expected.second || "—")}
      </b>
    </div>
  `;


  navigationStatus.textContent =
    `Chanson ${correctionSong} / 10`;


  document
    .getElementById(
      "previousSong"
    )
    .disabled =
      correctionSong === 1;


  document
    .getElementById(
      "nextSong"
    )
    .disabled =
      correctionSong === 10;


  teamAnswers.innerHTML = "";


  const teams =
    Object.entries(
      submissions[correctionRound]
      || {}
    );


  if (teams.length === 0) {

    teamAnswers.innerHTML = `

      <p class="empty">
        Aucune équipe n'a encore envoyé cette manche.
      </p>
    `;

    return;

  }


  teams
    .sort(
      (a, b) =>
        a[1]
          .teamName
          .localeCompare(
            b[1].teamName,
            "fr"
          )
    )
    .forEach(
      ([teamId, submission]) => {

        const answer =
          submission
            .answers
            ?.[correctionSong]
          || {};


        const correction =
          corrections[correctionRound]
            ?.[teamId]
            ?.[correctionSong]
          || {};


        const titleAccepted =
          correction.title === true;


        const secondAccepted =
          correction.second === true;


        const score =
          calculateSongScore(
            titleAccepted,
            secondAccepted
          );


        const card =
          document.createElement(
            "div"
          );


        card.className =
          "team-answer";


        card.innerHTML = `

          <div class="team-header">

            <strong>
              ${escapeHTML(submission.teamName)}
            </strong>

            <strong>
              ${score}/5
            </strong>

          </div>


          <div class="answer-buttons">

            <button
              class="answer-button
              ${titleAccepted ? "accepted" : ""}"
              data-team="${teamId}"
              data-field="title"
            >

              <span class="answer-label">
                Titre
              </span>

              <span class="answer-text">

                ${titleAccepted ? "✓ " : ""}

                ${escapeHTML(
                  answer.title || "—"
                )}

              </span>

            </button>


            <button
              class="answer-button
              ${secondAccepted ? "accepted" : ""}"
              data-team="${teamId}"
              data-field="second"
            >

              <span class="answer-label">
                ${secondLabel}
              </span>

              <span class="answer-text">

                ${secondAccepted ? "✓ " : ""}

                ${escapeHTML(
                  answer.second || "—"
                )}

              </span>

            </button>

          </div>
        `;


        teamAnswers.appendChild(
          card
        );

      }
    );


  document
    .querySelectorAll(
      ".answer-button"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const teamId =
              button.dataset.team;

            const field =
              button.dataset.field;


            await toggleCorrection(
              teamId,
              field
            );

          }
        );

      }
    );

}


/* =========================
   MODIFIER UNE CORRECTION
   ========================= */

async function toggleCorrection(
  teamId,
  field
) {

  const existing =
    corrections[correctionRound]
      ?.[teamId]
      ?.[correctionSong]
    || {};


  const updated = {

    title:
      existing.title === true,

    second:
      existing.second === true

  };


  updated[field] =
    !updated[field];


  await set(
    ref(
      database,
      `rounds/${correctionRound}/corrections/${teamId}/${correctionSong}`
    ),
    updated
  );


  if (
    !corrections[correctionRound][teamId]
  ) {

    corrections[correctionRound][teamId] =
      {};

  }


  corrections[correctionRound]
    [teamId]
    [correctionSong] =
      updated;


  renderCorrection();
  renderRankings();

}


/* =========================
   TOUT VALIDER
   ========================= */

document
  .getElementById(
    "validateAllButton"
  )
  .addEventListener(
    "click",
    async () => {

      const teams =
        Object.keys(
          submissions[correctionRound]
          || {}
        );


      for (
        const teamId of teams
      ) {

        const updated = {
          title: true,
          second: true
        };


        await set(
          ref(
            database,
            `rounds/${correctionRound}/corrections/${teamId}/${correctionSong}`
          ),
          updated
        );


        if (
          !corrections[correctionRound]
            [teamId]
        ) {

          corrections[correctionRound]
            [teamId] = {};

        }


        corrections[correctionRound]
          [teamId]
          [correctionSong] =
            updated;

      }


      renderCorrection();
      renderRankings();

    }
  );


/* =========================
   NAVIGATION CORRECTION
   ========================= */

document
  .getElementById(
    "previousSong"
  )
  .addEventListener(
    "click",
    () => {

      if (
        correctionSong > 1
      ) {

        correctionSong--;

        renderCorrection();

      }

    }
  );


document
  .getElementById(
    "nextSong"
  )
  .addEventListener(
    "click",
    () => {

      if (
        correctionSong < 10
      ) {

        correctionSong++;

        renderCorrection();

      }

    }
  );


correctionRoundSelect
  .addEventListener(
    "change",
    async () => {

      correctionRound =
        Number(
          correctionRoundSelect.value
        );

      correctionSong = 1;


      await loadAllGameData();

    }
  );


document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    loadAllGameData
  );


/* =========================
   CALCUL DES SCORES
   ========================= */

function calculateSongScore(
  title,
  second
) {

  let score = 0;


  if (title) {
    score += 2;
  }


  if (second) {
    score += 2;
  }


  if (
    title
    &&
    second
  ) {

    score += 1;

  }


  return score;

}


function calculateRoundScore(
  round,
  teamId
) {

  let total = 0;


  for (
    let song = 1;
    song <= 10;
    song++
  ) {

    const correction =
      corrections[round]
        ?.[teamId]
        ?.[song]
      || {};


    total +=
      calculateSongScore(
        correction.title === true,
        correction.second === true
      );

  }


  return total;

}


/* =========================
   CLASSEMENTS
   ========================= */

function renderRankings() {

  renderRoundRanking();
  renderGlobalRanking();

}


function renderRoundRanking() {

  const teams =
    Object.entries(
      submissions[correctionRound]
      || {}
    )
    .map(
      ([teamId, data]) => ({

        teamId,

        name:
          data.teamName
          || "Équipe",

        score:
          calculateRoundScore(
            correctionRound,
            teamId
          )

      })
    )
    .sort(
      (a, b) =>
        b.score - a.score
        ||
        a.name.localeCompare(
          b.name,
          "fr"
        )
    );


  const roundName =
    settings
      ?.rounds
      ?.[correctionRound]
      ?.name
    || "";


  document
    .getElementById(
      "roundRankingTitle"
    )
    .textContent =
      `Classement — Manche ${correctionRound}${roundName ? " · " + roundName : ""}`;


  renderRankingList(
    roundRanking,
    teams,
    50
  );

}


function renderGlobalRanking() {

  const teamMap = {};


  for (
    let round = 1;
    round <= 3;
    round++
  ) {

    for (
      const [teamId, data]
      of Object.entries(
        submissions[round]
        || {}
      )
    ) {

      if (
        !teamMap[teamId]
      ) {

        teamMap[teamId] = {

          teamId,

          name:
            data.teamName
            || "Équipe",

          score: 0

        };

      }


      teamMap[teamId].name =
        data.teamName
        || teamMap[teamId].name;


      teamMap[teamId].score +=
        calculateRoundScore(
          round,
          teamId
        );

    }

  }


  const teams =
    Object.values(
      teamMap
    )
    .sort(
      (a, b) =>
        b.score - a.score
        ||
        a.name.localeCompare(
          b.name,
          "fr"
        )
    );


  const currentRound =
    Math.max(
      1,
      Number(
        settings?.currentRound
        || 1
      )
    );


  const maxScore =
    currentRound * 50;


  renderRankingList(
    globalRanking,
    teams,
    maxScore
  );

}


/* =========================
   AFFICHAGE CLASSEMENT
   ========================= */

function renderRankingList(
  container,
  teams,
  maxScore
) {

  container.innerHTML = "";


  if (
    teams.length === 0
  ) {

    container.innerHTML = `

      <p class="empty">
        Aucun score pour le moment.
      </p>
    `;

    return;

  }


  let previousScore = null;
  let previousRank = 0;


  teams.forEach(
    (team, index) => {

      let rank;


      if (
        previousScore !== null
        &&
        team.score === previousScore
      ) {

        rank =
          previousRank;

      }

      else {

        rank =
          index + 1;

      }


      previousScore =
        team.score;

      previousRank =
        rank;


      let rankDisplay =
        `${rank}.`;


      if (rank === 1) {

        rankDisplay = "🥇";

      }

      else if (rank === 2) {

        rankDisplay = "🥈";

      }

      else if (rank === 3) {

        rankDisplay = "🥉";

      }


      const row =
        document.createElement(
          "div"
        );


      row.className =
        "ranking-row";


      row.innerHTML = `

        <div class="rank">
          ${rankDisplay}
        </div>

        <div>
          ${escapeHTML(team.name)}
        </div>

        <div class="score">
          ${team.score}/${maxScore}
        </div>
      `;


      container.appendChild(
        row
      );

    }
  );

}


/* =========================
   REINITIALISER LA PARTIE
   ========================= */

document
  .getElementById(
    "resetGameButton"
  )
  .addEventListener(
    "click",
    async () => {

      const confirmation =
  confirm(
    "Êtes-vous sûr de vouloir réinitialiser la partie ? Toutes les équipes, réponses, corrections et scores seront supprimés."
  );

if (!confirmation) {
  return;
}


      const button =
        document.getElementById(
          "resetGameButton"
        );


      button.disabled = true;

      button.textContent =
        "Réinitialisation…";


      try {

        /*
          Supprimer les équipes.
        */

        await remove(
          ref(
            database,
            "teams"
          )
        );


        /*
          Supprimer réponses et corrections
          des trois manches.
        */

        for (
          let round = 1;
          round <= 3;
          round++
        ) {

          await remove(
            ref(
              database,
              `rounds/${round}/submissions`
            )
          );


          await remove(
            ref(
              database,
              `rounds/${round}/corrections`
            )
          );

        }


        /*
          Réinitialiser les données locales
          de l'interface admin.
        */

        submissions = {
          1: {},
          2: {},
          3: {}
        };


        corrections = {
          1: {},
          2: {},
          3: {}
        };


        alert(
          "Partie réinitialisée ✓\n\nToutes les équipes, réponses, corrections et scores ont été supprimés."
        );


        button.textContent =
          "Réinitialiser la partie";

        button.disabled = false;

      }

      catch (error) {

        console.error(error);


        alert(
          "La réinitialisation a échoué."
        );


        button.textContent =
          "Réinitialiser la partie";

        button.disabled = false;

      }

    }
  );


/* =========================
   SECURITE AFFICHAGE
   ========================= */

function escapeHTML(value) {

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}
